# Datasource is supplied by @ServiceConnection from the Postgres container.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:1
    properties:
      # In-JVM mock registry shared by every serde using this scope: the app's consumer and the
      # DLT/test producer resolve schema ids against the same map, no registry container needed.
      schema.registry.url: mock://shipping-test
    listener:
      # These tests exercise the claim-plus-write transaction directly. Starting the listener
      # containers would only add a broker dependency and startup latency without testing more.
      auto-startup: false

demo:
  inbox:
    cleanup:
      # No scheduler noise during tests.
      enabled: false

logging:
  level:
    com.demo: DEBUG
    org.testcontainers: WARN
