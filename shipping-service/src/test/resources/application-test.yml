# Test-only overrides of application.yml. The datasource is supplied by @ServiceConnection from
# the Postgres container.
spring:
  kafka:
    # Deliberately unreachable: no test in this module talks to a broker.
    bootstrap-servers: localhost:1
    listener:
      # These tests exercise the claim-plus-write transaction directly. Starting the listener
      # containers would only add a broker dependency and startup latency without testing more.
      auto-startup: false

demo:
  inbox:
    cleanup:
      # No scheduler noise during tests.
      enabled: false

logging:
  level:
    org.testcontainers: WARN
