spring:
  application:
    name: shipping-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/shippingdb
    username: demo
    password: demo
    hikari:
      maximum-pool-size: 16
      pool-name: shipping-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:19092,localhost:29092,localhost:39092
    properties:
      # Common on purpose: reaches the listeners' KafkaAvroDeserializer and the dead-letter
      # producer's KafkaAvroSerializer alike, and one SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL
      # env var overrides it in docker-compose. (The admin client logs it as an unknown config;
      # harmless.)
      schema.registry.url: http://localhost:8081
    consumer:
      group-id: shipping-service
      auto-offset-reset: earliest
      # Offsets are committed by the container after the listener returns, never by the client on a
      # timer. Auto-commit would acknowledge events before they were processed, which would lose
      # them on a crash -- the inbox cannot recover an event it never saw.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps the real deserializer and converts a deserialization failure
      # into a record the error handler can route to the DLT. Without it, an unparseable payload
      # (or a schema id the registry does not know) throws inside poll() and blocks the partition
      # forever -- no retry policy can help, because the record is never handed to the listener.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # Confluent wire format: reads the schema id from the 5-byte prefix, fetches the writer
        # schema from the registry, decodes. The consumer's contract is the schema, not a Java
        # class name -- there is no __TypeId__ header and no trusted-packages list.
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        # Materialise into the generated com.demo.events.avro.* classes (resolved by the schema's
        # full name) instead of GenericRecord, so @Payload parameters can be typed.
        specific.avro.reader: true
    listener:
      ack-mode: record
      concurrency: 3
      # Continues the trace from each record's traceparent header, so these logs carry the trace id
      # of the order request, and times every invocation as a spring.kafka.listener metric. Not
      # what supplies the topic/partition/offset headers the inbox records -- Spring Kafka always
      # provides those.
      observation-enabled: true
    producer:
      # Used only by the dead-letter publisher.
      acks: all
      properties:
        # The dead-letter topic carries both event types, same as orders.v1: one subject per record
        # name rather than one orders.v1.DLT-value that the second type would collide with.
        value.subject.name.strategy: io.confluent.kafka.serializers.subject.RecordNameStrategy
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # No value-serializer here. The recoverer publishes two shapes -- the deserialized Avro record
      # when the listener threw, and the original byte[] when deserialization itself failed -- and
      # KafkaAvroSerializer cannot take the second. KafkaConsumerConfig builds the producer with a
      # DelegatingByTypeSerializer (byte[] -> ByteArraySerializer, SpecificRecord ->
      # KafkaAvroSerializer), which has no property-based configuration.

demo:
  inbox:
    enabled: true
    cleanup:
      enabled: true
      # Retention IS the deduplication window: anything redelivered after this is processed again.
      # It must stay comfortably above the topic's own retention.
      retention: 7d
      interval: 1h

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: shipping-service

logging:
  level:
    com.demo: DEBUG
    org.springframework.kafka: INFO
