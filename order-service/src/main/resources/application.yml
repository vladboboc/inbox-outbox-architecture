spring:
  application:
    name: order-service

  # Java 25 virtual threads: the outbox relay blocks on the broker ack, so carrier threads
  # are not held during the wait.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: demo
    password: demo
    hikari:
      maximum-pool-size: 16
      pool-name: order-pool

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. "validate" turns a drifted schema into a startup failure
      # instead of a runtime surprise.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:19092,localhost:29092,localhost:39092
    properties:
      # Common (not producer-scoped) on purpose: spring.kafka.properties.* feeds producer, consumer
      # and admin clients alike, so one key -- and one SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL
      # env var in docker-compose -- covers every client. A producer-scoped copy would override
      # this one and silently ignore the compose value.
      schema.registry.url: http://localhost:8081
    producer:
      # acks=all + the brokers' min.insync.replicas=2 is what makes the outbox relay's
      # blocking send a real durability guarantee rather than fire-and-forget.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Confluent wire format: 0x00 magic byte + 4-byte schema id + Avro binary. The schema is
      # registered on first use under its record name (see value.subject.name.strategy below;
      # auto.register.schemas defaults to true; in
      # production register schemas in CI and set it to false). The payload reaching this
      # serializer is already the generated SpecificRecord -- see KafkaOutboxRoutingConfig.
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 20000
        request.timeout.ms: 10000
        # Fail fast when brokers are down so the record is retried by the outbox poller
        # instead of blocking a relay thread for two minutes.
        max.block.ms: 8000
        # orders.v1 carries two record types (OrderCreated, OrderCancelled). The default
        # TopicNameStrategy would register both under orders.v1-value and the second would fail the
        # compatibility check; RecordNameStrategy registers each under its own full name
        # (com.demo.events.avro.OrderCreated, ...). The consumer needs no setting: it reads the
        # schema id from the payload.
        value.subject.name.strategy: io.confluent.kafka.serializers.subject.RecordNameStrategy
    template:
      # The KafkaTemplate's observation writes a W3C traceparent header onto each record. The relay
      # sends from inside the trace namastack restored from the outbox row, so that header carries
      # the trace of the HTTP request that scheduled the event.
      observation-enabled: true

namastack:
  outbox:
    enabled: true
    polling:
      # Adaptive backs off to max-interval while idle and tightens up under load.
      trigger: adaptive
      batch-size: 20
      adaptive:
        min-interval: 500ms
        max-interval: 5s
    processing:
      # Halting a key on its first failure is what preserves per-key ordering: without it a
      # later event for the same order could overtake the one that is failing.
      stop-on-first-failure: true
      # Kept so outbox rows stay visible for the demo. In production this table needs a
      # retention strategy or it grows without bound.
      delete-completed-records: false
    retry:
      policy: exponential
      max-retries: 10
      exponential:
        initial-delay: 2s
        max-delay: 30s
        multiplier: 2.0
      jitter: 500ms
    instance:
      heartbeat-interval: 5s
      stale-instance-timeout: 30s
      rebalance-interval: 10s
    kafka:
      enabled: true
      # Defaults to true, which imports a jar-internal property source setting Spring Kafka's
      # JacksonJsonSerializer as the producer's value-serializer. Off, because the wire format is
      # Confluent Avro (spring.kafka.producer.value-serializer above). Note this only concerns
      # Kafka: the outbox table still stores the payload as Jackson JSON via namastack's own
      # OutboxPayloadSerializer, which is unrelated to this flag.
      enable-json: false
      # No default-topic here: it only feeds namastack's built-in routing, which
      # KafkaOutboxRoutingConfig replaces. Topics, including the fallback, are set there.

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        # "outbox" is namastack-outbox-actuator's endpoint: @Endpoint(id = "outbox"). It declares
        # only @DeleteOperations, so it exposes DELETE /actuator/outbox/{status} and
        # DELETE /actuator/outbox/{recordKey}/{status} — there is no GET to read records with.
        include: health,info,metrics,prometheus,outbox
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: order-service
    distribution:
      # Without this, the Observation timers publish only count/sum/max and no _bucket series, so
      # histogram_quantile() in the Grafana dashboard returns nothing.
      percentiles-histogram:
        outbox.record.process: true
        outbox.record.schedule: true
      slo:
        outbox.record.process: 50ms,200ms,1s,5s
  tracing:
    sampling:
      # Trace every request. No exporter is configured, so spans stay in-process: the ids exist to
      # correlate logs and Kafka records, not to feed a tracing backend.
      probability: 1.0

logging:
  level:
    com.demo: DEBUG
    io.namastack.outbox: INFO
